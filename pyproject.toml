[build-system]
requires = ["setuptools>=82,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "northstar-claims-ai"
version = "0.1.0"
description = "Synthetic motor claims domain and Python engineering foundation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.11.7,<3", "pydantic-settings>=2.10.1,<3"]

[project.optional-dependencies]
agents = ["agent-framework-core==1.23.0", "msgspec==0.22.0"]
mcp = ["agent-framework-core==1.23.0", "msgspec==0.22.0", "mcp==2.2.0", "tenacity==9.1.4"]
api = ["agent-framework-core==1.23.0", "msgspec==0.22.0", "fastapi==0.162.2", "annotated-doc==0.0.5", "starlette==1.10.0", "httpx2==2.16.0"]
ui = ["agent-framework-core==1.23.0", "msgspec==0.22.0", "fastapi==0.162.2", "annotated-doc==0.0.5", "starlette==1.10.0", "httpx2==2.16.0", "uvicorn==0.54.0"]
identity = ["PyJWT==2.15.1", "cryptography==50.0.2"]
observability = ["opentelemetry-sdk==1.45.2"]
dev = ["pytest>=8.4,<9", "ruff>=0.16.4,<0.17", "mypy>=1.16,<2", "setuptools>=82,<83"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
claims_ai = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]
extend-exclude = ["build", "dist", "*.egg-info"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "deployment"]
strict = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
